version: '3.8'

# Dokploy Docker Compose Configuration
# This uses AWS Secrets Manager for all sensitive credentials
# Only requires AWS credentials as environment variables

services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Node Environment
      NODE_ENV: production
      PORT: 3000

      # AWS Credentials for Secrets Manager
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # All other secrets (DATABASE_URL, NEXTAUTH_*, REDIS_URL) will be
      # automatically fetched from AWS Secrets Manager by the app
    volumes:
      - atlassian-pdfs:/app/apps/web/public/atlassian-pdfs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    environment:
      # Node Environment
      NODE_ENV: production

      # AWS Credentials for Secrets Manager
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # All other secrets (DATABASE_URL, REDIS_URL, email credentials, etc.)
      # will be automatically fetched from AWS Secrets Manager by the app
    volumes:
      - atlassian-pdfs:/app/apps/web/public/atlassian-pdfs
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  # Shared volume for Atlassian PDFs
  # Worker generates PDFs -> Web serves them at /atlassian-pdfs/*
  atlassian-pdfs:
    driver: local
