version: '3.8'

# Dokploy Docker Compose Configuration - Combined Web + Worker Deployment
# This uses AWS Secrets Manager for all sensitive credentials
# Only requires AWS credentials as environment variables
# Runs both Next.js web server (port 3000) and background workers

services:
  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
      # Using BuildKit for cache mounts (DOCKER_BUILDKIT=1)
      args:
        BUILDKIT_INLINE_CACHE: "1"
    ports:
      - "3000:3000"
    environment:
      # Node Environment
      NODE_ENV: production

      # AWS Credentials for Secrets Manager
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Redis Configuration (for BullMQ job queues)
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # All other secrets (DATABASE_URL, REDIS_URL, email credentials, etc.)
      # will be automatically fetched from AWS Secrets Manager by the app
    volumes:
      - atlassian-pdfs:/app/apps/web/public/atlassian-pdfs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # CACHE & QUEUES (Redis)
  # ============================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Shared volume for Atlassian PDFs
  # Worker generates PDFs -> Web serves them at /atlassian-pdfs/*
  atlassian-pdfs:
    driver: local
  # Redis data persistence
  redisdata:
    driver: local
